name: learning-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lp}
      POSTGRES_DB: ${POSTGRES_DB:-learning_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: lp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lpminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lpminiopass}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-lpminio} $${MINIO_ROOT_PASSWORD:-lpminiopass};
      mc mb --ignore-existing local/learning-platform;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lpminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lpminiopass}

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    container_name: lp-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ASYNC_INGESTION: ${ASYNC_INGESTION:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-please}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      OPERATOR_BOOTSTRAP_TOKEN: ${OPERATOR_BOOTSTRAP_TOKEN:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lp}:${POSTGRES_PASSWORD:-lp}@postgres:5432/${POSTGRES_DB:-learning_platform}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: learning-platform
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-lpminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lpminiopass}
      STORAGE_BACKEND: s3
      USE_LOCAL_EMBEDDINGS: ${USE_LOCAL_EMBEDDINGS:-false}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b}
      LOCAL_VISION_MODEL: ${LOCAL_VISION_MODEL:-}
      TUTOR_MODEL: ${TUTOR_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-12}
      FEATURE_TUTOR: ${FEATURE_TUTOR:-true}
      FEATURE_GITHUB_INGESTION: ${FEATURE_GITHUB_INGESTION:-true}
      FEATURE_YOUTUBE_INGESTION: ${FEATURE_YOUTUBE_INGESTION:-false}
      FEATURE_KNOWLEDGE_MAP: ${FEATURE_KNOWLEDGE_MAP:-true}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/workspace/services/api/.data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    container_name: lp-migrate
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lp}:${POSTGRES_PASSWORD:-lp}@postgres:5432/${POSTGRES_DB:-learning_platform}
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    container_name: lp-worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ASYNC_INGESTION: ${ASYNC_INGESTION:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lp}:${POSTGRES_PASSWORD:-lp}@postgres:5432/${POSTGRES_DB:-learning_platform}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: learning-platform
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-lpminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lpminiopass}
      STORAGE_BACKEND: s3
      USE_LOCAL_EMBEDDINGS: ${USE_LOCAL_EMBEDDINGS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/workspace/services/api/.data/uploads
    command: python -m services.worker.worker

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
